<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emotion Detection Application</title>
    <script src="{{ url_for('static', filename='mywebscript.js') }}"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f7f9fa; }
        .container { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); max-width: 650px; margin: auto; }
        textarea { width: 100%; height: 90px; padding: 10px; margin-top: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background-color: #0f62fe; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; margin-top: 15px; font-weight: bold; }
        button:hover { background-color: #0353e9; }
        #system_response { margin-top: 20px; padding: 15px; background: #eef2f6; border-radius: 4px; font-weight: 500; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Emotion Detection Web App</h2>
        <label for="textToAnalyze">Enter text to detect emotion:</label>
        <textarea id="textToAnalyze" placeholder="Type customer review here..."></textarea>
        <button onclick="RunSentimentAnalysis()">Run Sentiment Analysis</button>
        <div id="system_response">System response will appear here.</div>
    </div>
</body>
</html>
